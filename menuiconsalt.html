<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Application Form | Hot Beans Web</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <style>
    .hero {
      background: linear-gradient(to right, #0f2027, #2c5364);
      color: white;
      padding: 80px 20px;
      text-align: center;
    }

    .form-card {
      max-width: 700px;
      margin: auto;
      border-radius: 12px;
    }

    .section-title {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body class="w3-light-grey">


<div class="w3-top w3-black">
  <div class="w3-bar">
    <a href="index.html" class="w3-bar-item w3-button">Home Page</a>
    <a href="smthalt.html" class="w3-bar-item w3-button">About Us</a>
    <a href="navuigationalt.html" class="w3-bar-item w3-button">Meet Our Trainees</a>
    <a href="menuiconsalt.html" class="w3-bar-item w3-button">Job application</a>
    <a href="page1alt.html" class="w3-bar-item w3-button">Job Roles Available</a>
  </div>
</div>


<div class="hero" style="margin-top:46px">
  <h1 class="w3-xxxlarge">Join Hot Beans Web</h1>
  <p class="w3-large">Complete the form below to apply</p>
</div>


<div class="w3-container w3-padding-32">

  <div class="w3-card w3-white w3-padding form-card">

    <form action="submitted.html" method="get">

      
      <h3 class="section-title">Your Details</h3>

      <label>First Name</label>
      <input class="w3-input w3-border w3-margin-bottom" name="first" type="text" required>

      <label>Last Name</label>
      <input class="w3-input w3-border w3-margin-bottom" name="last" type="text" required>

      <label>Email Address</label>
      <input class="w3-input w3-border w3-margin-bottom" name="email" type="email" required>

      <label>Phone Number</label>
      <input class="w3-input w3-border w3-margin-bottom" name="phone" type="tel">

      
      <h3 class="section-title">Application Information</h3>

      <label>Which role are you applying for?</label>
      <select class="w3-select w3-border w3-margin-bottom" name="interest" required>
        <option value="" disabled selected>Select a role</option>
        <option>Front-End Trainee Web Developer</option>
        <option>JavaScript Trainee Web Developer</option>
        <option>Back-End Trainee Web Developer</option>
        <option>Content Management Trainee</option>
        <option>Website Tester / QA Trainee</option>
      </select>

      <label>Availability</label>
      <select class="w3-select w3-border w3-margin-bottom" name="availability" required>
        <option value="" disabled selected>Select availability</option>
        <option>Weekdays</option>
        <option>Weekends</option>
        <option>Flexible</option>
      </select>

      <label>Why do you want to join Hot Beans Web?</label>
      <textarea class="w3-input w3-border w3-margin-bottom" name="message" rows="4"></textarea>

     
      <button class="w3-button w3-blue w3-block w3-padding-large w3-round">
        Submit Application
      </button>

    </form>

  </div>

</div>


<footer class="w3-container w3-black w3-center w3-padding-16">
  <p> 2026 Hot Beans Web generated with AI </p>
</footer>

</body>
</html>
